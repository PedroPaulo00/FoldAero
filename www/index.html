<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1c6fb8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FoldAero">
  <title>FoldAero</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icon-64.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preload" href="assets/fonts/frutiger.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica o tema antes do primeiro paint para evitar flash
    (function () {
      var t = null;
      try { t = localStorage.getItem('dv-theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      // App nativo (Capacitor injeta a ponte antes desta linha)
      var w = window.webkit;
      if (window.androidBridge || (w && w.messageHandlers && w.messageHandlers.bridge)) {
        document.documentElement.classList.add('native');
      }
    })();
  </script>
</head>
<body>
  <!-- Sprite de ícones (gradientes precisam estar no documento, por isso não usa display:none) -->
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff6b0"/><stop offset=".45" stop-color="#ffd23a"/><stop offset="1" stop-color="#e08a00"/>
      </linearGradient>
      <linearGradient id="g-folder-back" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f7d775"/><stop offset="1" stop-color="#d9a52c"/>
      </linearGradient>
      <linearGradient id="g-folder-front" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff2b8"/><stop offset=".5" stop-color="#ffd966"/><stop offset="1" stop-color="#eeb43a"/>
      </linearGradient>
      <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#bfe6ff"/><stop offset=".5" stop-color="#3a9be8"/><stop offset="1" stop-color="#0a4f9e"/>
      </linearGradient>
      <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d6ffb8"/><stop offset=".5" stop-color="#5cc531"/><stop offset="1" stop-color="#257a10"/>
      </linearGradient>
      <linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffc4b8"/><stop offset=".5" stop-color="#e84a2c"/><stop offset="1" stop-color="#9b1a08"/>
      </linearGradient>
      <linearGradient id="g-bin" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#9fb4c8"/><stop offset=".35" stop-color="#f4f9ff"/><stop offset=".7" stop-color="#c7d6e6"/><stop offset="1" stop-color="#7e93a8"/>
      </linearGradient>
      <linearGradient id="g-photo" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7cc8ff"/><stop offset=".6" stop-color="#bfe6ff"/><stop offset=".61" stop-color="#7fcf4a"/><stop offset="1" stop-color="#3e8f1c"/>
      </linearGradient>
      <radialGradient id="g-orb" cx=".5" cy=".35" r=".7">
        <stop offset="0" stop-color="#9fe2ff"/><stop offset=".45" stop-color="#1f86d6"/><stop offset="1" stop-color="#062f66"/>
      </radialGradient>
      <linearGradient id="g-shine" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="g-pencil" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe680"/><stop offset=".5" stop-color="#ffc21a"/><stop offset="1" stop-color="#d98a00"/>
      </linearGradient>
      <linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe9c2"/><stop offset="1" stop-color="#d9a866"/>
      </linearGradient>
      <linearGradient id="g-metal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f4f9ff"/><stop offset=".45" stop-color="#b9c8d8"/><stop offset=".55" stop-color="#8fa3b8"/><stop offset="1" stop-color="#dfe8f1"/>
      </linearGradient>
      <linearGradient id="g-eraser" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffc4cf"/><stop offset="1" stop-color="#e0708a"/>
      </linearGradient>
      <linearGradient id="g-moon" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fffbe0"/><stop offset="1" stop-color="#c9b25a"/>
      </linearGradient>
    </defs>

    <!-- Geral: pilha de fotos -->
    <symbol id="i-photos" viewBox="0 0 32 32">
      <rect x="9" y="3" width="20" height="16" rx="1.5" fill="#fff" stroke="#6f8eaa" transform="rotate(8 19 11)"/>
      <rect x="4" y="9" width="22" height="18" rx="1.5" fill="#fff" stroke="#55779a"/>
      <rect x="6" y="11" width="18" height="12" fill="url(#g-photo)"/>
      <circle cx="19.5" cy="14" r="2" fill="#fff6a8"/>
      <path d="M6 23l5-5 4 3 3-2 6 4z" fill="#2f7d18" opacity=".8"/>
    </symbol>

    <!-- Pasta estilo Vista -->
    <symbol id="i-folder" viewBox="0 0 32 32">
      <path d="M2.5 7.5a2 2 0 0 1 2-2h7l2.5 2.5h13.5a2 2 0 0 1 2 2V25a2 2 0 0 1-2 2h-23a2 2 0 0 1-2-2z" fill="url(#g-folder-back)" stroke="#b07f14"/>
      <rect x="5" y="9" width="21" height="12" rx="1" fill="#fff" stroke="#c9d6e2"/>
      <path d="M1.8 13.5a1.5 1.5 0 0 1 1.5-1.6h25.4a1.5 1.5 0 0 1 1.5 1.7l-1.4 11.6a2 2 0 0 1-2 1.8H5.1a2 2 0 0 1-2-1.8z" fill="url(#g-folder-front)" stroke="#c08c18"/>
      <path d="M3.5 13.5h25" stroke="#fff" stroke-opacity=".8"/>
    </symbol>

    <!-- Estrela clássica -->
    <symbol id="i-star" viewBox="0 0 32 32">
      <path d="M16 2.8l4 8.6 9.3 1.1-6.9 6.4 1.9 9.3L16 23.5l-8.3 4.7 1.9-9.3-6.9-6.4 9.3-1.1z" fill="url(#g-gold)" stroke="#a96700" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M16 5.5l3 6.4 6.6.8-3 2.6c-3.3-1-7.5-1-12.6.4l-3.6-3 6.6-.8z" fill="#fff" opacity=".55"/>
    </symbol>
    <symbol id="i-star-off" viewBox="0 0 32 32">
      <path d="M16 2.8l4 8.6 9.3 1.1-6.9 6.4 1.9 9.3L16 23.5l-8.3 4.7 1.9-9.3-6.9-6.4 9.3-1.1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>

    <!-- Lixeira (Vista) -->
    <symbol id="i-trash" viewBox="0 0 32 32">
      <ellipse cx="16" cy="6.5" rx="10.5" ry="3" fill="#dfe9f3" stroke="#6d8296"/>
      <path d="M5.5 6.5l2 20a3 3 0 0 0 3 2.7h11a3 3 0 0 0 3-2.7l2-20c0 1.7-4.7 3-10.5 3S5.5 8.2 5.5 6.5z" fill="url(#g-bin)" stroke="#5f7489"/>
      <path d="M11 11.5l.8 14.5M16 12v14.5M21 11.5l-.8 14.5" stroke="#7d93a8" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
      <path d="M8 8.5c2 1 13.5 1.2 16 0" stroke="#fff" stroke-opacity=".8"/>
    </symbol>
    <symbol id="i-trash-full" viewBox="0 0 32 32">
      <use href="#i-trash"/>
      <rect x="9" y="1.5" width="9" height="7" rx=".6" fill="#fff" stroke="#7f95aa" transform="rotate(-14 13 5)"/>
      <rect x="14" y="1" width="9" height="7" rx=".6" fill="url(#g-photo)" stroke="#55779a" transform="rotate(10 18 4.5)"/>
    </symbol>

    <!-- Álbuns: duas pastas -->
    <symbol id="i-albums" viewBox="0 0 32 32">
      <g transform="translate(5 -2) scale(.8)"><use href="#i-folder"/></g>
      <g transform="translate(0 6) scale(.8)"><use href="#i-folder"/></g>
    </symbol>

    <!-- Navegação Win7 (botões redondos azuis) -->
    <symbol id="i-back" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="14" fill="url(#g-orb)" stroke="#0b3f7d"/>
      <ellipse cx="16" cy="10" rx="10" ry="6" fill="url(#g-shine)" opacity=".7"/>
      <path d="M18.5 9l-7 7 7 7M11.5 16H23" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Controles do visualizador -->
    <symbol id="i-zoom" viewBox="0 0 32 32">
      <circle cx="13" cy="13" r="8" fill="#e8f5ff" stroke="currentColor" stroke-width="2.5"/>
      <path d="M19 19l8 8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path d="M13 9.5v7M9.5 13h7" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-zoom-out" viewBox="0 0 32 32">
      <circle cx="13" cy="13" r="8" fill="#e8f5ff" stroke="currentColor" stroke-width="2.5"/>
      <path d="M19 19l8 8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path d="M9.5 13h7" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-prev" viewBox="0 0 32 32">
      <path d="M8 7v18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M25 7.5v17L11 16z" fill="currentColor"/>

    <symbol id="i-next" viewBox="0 0 32 32">

    <symbol id="i-slideshow" viewBox="0 0 32 32">
      <rect x="5" y="8" width="22" height="16" rx="1.5" fill="#fff" stroke="#fff"/>
      <rect x="7" y="10" width="18" height="12" fill="url(#g-photo)"/>

    <symbol id="i-pause" viewBox="0 0 32 32">

    <symbol id="i-rotate" viewBox="0 0 32 32">

      <path d="M14 2.5l6 4.5-6 4.5z" fill="currentColor"/>

    <symbol id="i-delete" viewBox="0 0 32 32">

    <symbol id="i-restore" viewBox="0 0 32 32">

    <symbol id="i-check" viewBox="0 0 32 32">

      <path d="M9 16.5l5 5 9-11" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

    <symbol id="i-select" viewBox="0 0 32 32">

    </symbol>
    <symbol id="i-select-off" viewBox="0 0 32 32">

      <rect x="6.5" y="6.5" width="19" height="19" rx="2" fill="none" stroke="#dbe6f1" stroke-width="1.4"/>
    </symbol>
    <symbol id="i-crop" viewBox="0 0 32 32">

      <rect x="11" y="11" width="10" height="10" fill="url(#g-photo)" opacity=".9"/>
    </symbol>

      </g>
      <circle cx="16" cy="16" r="7" fill="url(#g-gold)" stroke="#c07a00"/>
    </symbol>
    <symbol id="i-info" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="13.5" fill="url(#g-blue)" stroke="#0b3f7d"/>
      <ellipse cx="16" cy="10" rx="9.5" ry="5.5" fill="url(#g-shine)" opacity=".55"/>
      <circle cx="16" cy="9.5" r="2.2" fill="#fff"/>
      <path d="M16 14v10" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>

    <symbol id="i-warning" viewBox="0 0 32 32">
      <path d="M16 3L30 28H2z" fill="url(#g-gold)" stroke="#a96700" stroke-linejoin="round" stroke-width="1.4"/>

      <circle cx="16" cy="23.5" r="1.9" fill="#3a2a00"/>

    <symbol id="i-fullscreen" viewBox="0 0 32 32">
      <path d="M5 12V5h7M20 5h7v7M27 20v7h-7M12 27H5v-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="14" fill="rgba(0,0,0,.45)" stroke="#fff" stroke-width="2"/>
      <path d="M13 9.5v13l10-6.5z" fill="#fff"/>
    </symbol>
    <symbol id="i-sample" viewBox="0 0 32 32">
      <rect x="3" y="5" width="26" height="22" rx="2" fill="#fff" stroke="#55779a"/>
      <rect x="5" y="7" width="22" height="18" fill="url(#g-photo)"/>
      <path d="M5 21c5-6 10-6 22-3v7H5z" fill="#4fae24"/>
      <path d="M8 11c2-1 4 0 5 1M17 10c2-1 4 0 5 1" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    </symbol>
    <!-- Lápis -->
    <symbol id="i-rename" viewBox="0 0 32 32">
      <g transform="rotate(-45 16 16)">
        <path d="M7 12.2L1.2 16 7 19.8z" fill="url(#g-wood)" stroke="#8a6232" stroke-width=".8" stroke-linejoin="round"/>
        <path d="M3.4 14.6L1.2 16l2.2 1.4z" fill="#2b2b2b"/>
        <rect x="7" y="12.2" width="15" height="7.6" fill="url(#g-pencil)" stroke="#9a6a00" stroke-width=".8"/>
        <path d="M7 14.7h15M7 17.3h15" stroke="#c98a00" stroke-width=".7" opacity=".8"/>
        <path d="M7.6 13h14" stroke="#fff6c8" stroke-width=".9" opacity=".9"/>
        <rect x="22" y="12" width="3.4" height="8" fill="url(#g-metal)" stroke="#5f7489" stroke-width=".7"/>
        <path d="M23.1 12v8M24.3 12v8" stroke="#7e93a8" stroke-width=".5"/>
        <path d="M25.4 12h2.4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2.4z" fill="url(#g-eraser)" stroke="#a8455a" stroke-width=".7"/>
        <path d="M26 13h1.6" stroke="#fff" stroke-width=".7" opacity=".7"/>
      </g>
    </symbol>
    <!-- Paleta de cores -->
    <symbol id="i-palette" viewBox="0 0 32 32">
      <path d="M16 3C8.3 3 3 8.6 3 15.2 3 22.3 8.6 29 15.3 29c2.2 0 3.2-1.2 3.2-2.7 0-1.9-1.6-2.4-1.6-4 0-1.4 1.2-2.3 2.8-2.3h3.6c3.9 0 5.7-2.7 5.7-5.8C29 7.9 23.3 3 16 3z" fill="url(#g-wood)" stroke="#8a6232" stroke-width="1.2"/>
      <circle cx="9.5" cy="15" r="2.6" fill="#e84a2c" stroke="#9b1a08" stroke-width=".7"/>
      <circle cx="11.5" cy="9" r="2.6" fill="#ffd23a" stroke="#a96700" stroke-width=".7"/>
      <circle cx="17.5" cy="7.2" r="2.6" fill="#5cc531" stroke="#257a10" stroke-width=".7"/>
      <circle cx="23" cy="10.5" r="2.6" fill="#3a9be8" stroke="#0a4f9e" stroke-width=".7"/>
      <circle cx="12" cy="22.5" r="2.4" fill="#fff" opacity=".85"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="13" fill="url(#g-red)" stroke="#7d1405"/>
      <ellipse cx="16" cy="10.5" rx="9" ry="5" fill="url(#g-shine)" opacity=".6"/>
      <path d="M11.5 11.5l9 9M20.5 11.5l-9 9" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-github" viewBox="0 0 16 16">
      <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>

      <path d="M6 3.5l4.5 4.5L6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <div id="app" class="desktop">
    <div class="window" id="window">
      <!-- Barra de título Aero -->
      <header class="titlebar glass">
        <img class="titlebar-icon" src="assets/icon-64.png" alt="">
        <h1 class="titlebar-text">FoldAero</h1>
        <div class="caption-buttons" aria-hidden="true">
          <span class="cap cap-min"></span><span class="cap cap-max"></span><span class="cap cap-close"></span>
        </div>
      </header>

      <!-- Barra de endereço do Explorer -->
      <nav class="addressbar glass">
        <button class="nav-orb" id="btn-back" aria-label="Voltar" disabled>
          <svg><use href="#i-back"/></svg>
        </button>
        <div class="breadcrumb" id="breadcrumb"></div>
        <button class="theme-toggle" id="btn-theme" aria-label="Alternar tema">
          <svg class="ico-moon"><use href="#i-moon"/></svg>
          <svg class="ico-sun"><use href="#i-sun"/></svg>
        </button>
      </nav>

      <!-- Barra de comandos -->
      <div class="commandbar" id="commandbar"></div>

      <main class="content" id="content" tabindex="-1"></main>

      <div class="statusbar" id="statusbar"></div>
    </div>

    <!-- Barra de tarefas -->
    <footer class="taskbar" id="taskbar">
      <button class="start-orb" id="btn-start" aria-label="Menu Iniciar" aria-expanded="false">
        <span class="orb-glow"></span>
        <img src="assets/icon-64.png" alt="">
      </button>
      <a class="task" href="#/geral" data-tab="geral">
        <svg><use href="#i-photos"/></svg><span>Geral</span>
      </a>
      <a class="task" href="#/albuns" data-tab="albuns">
        <svg><use href="#i-albums"/></svg><span>Álbuns</span>
      </a>
      <a class="task" href="#/favoritos" data-tab="favoritos">
        <svg><use href="#i-star"/></svg><span>Favoritos</span>
      </a>
      <a class="task" href="#/lixeira" data-tab="lixeira">
        <svg><use href="#i-trash" id="task-trash-icon"/></svg><span>Lixeira</span>
      </a>
      <div class="tray"><span id="clock">00:00</span></div>
    </footer>

    <!-- Menu Iniciar -->
    <div class="start-menu" id="start-menu" hidden>
      <div class="start-left">
        <button class="start-item native-only" data-action="refresh">
          <svg><use href="#i-photos"/></svg>
          <span><b>Atualizar galeria</b><small>Procura fotos e vídeos novos</small></span>
        </button>
        <button class="start-item web-only" data-action="import-files">
          <svg><use href="#i-photos"/></svg>
          <span><b>Importar fotos e vídeos</b><small>Fotos, vídeos e GIFs do dispositivo</small></span>
        </button>
        <button class="start-item web-only" data-action="import-folder">
          <svg><use href="#i-import"/></svg>
          <span><b>Importar pasta</b><small>Cada pasta vira um álbum</small></span>
        </button>
        <button class="start-item" data-action="new-folder">
          <svg><use href="#i-folder"/></svg>
          <span><b>Nova pasta</b><small>Organize suas mídias do seu jeito</small></span>
        </button>
        <button class="start-item web-only" data-action="samples">
          <svg><use href="#i-sample"/></svg>
          <span><b>Imagens de exemplo</b><small>Papéis de parede no estilo Aero</small></span>
        </button>
        <div class="start-sep"></div>
        <button class="start-item" data-action="about">
          <svg><use href="#i-info"/></svg>
          <span><b>Sobre o FoldAero</b></span>
        </button>
      </div>
      <div class="start-right">
        <img class="start-avatar" src="assets/icon-192.png" alt="">
        <a class="start-link" href="#/geral">Geral</a>
        <a class="start-link" href="#/albuns">Álbuns</a>
        <a class="start-link" href="#/favoritos">Favoritos</a>
        <a class="start-link" href="#/lixeira">Lixeira</a>
        <button class="start-link" data-action="theme">Alternar tema</button>
      </div>
    </div>

    <!-- Visualizador (estilo Visualizador de Fotos do Windows) -->
    <section class="viewer" id="viewer" hidden aria-label="Visualizador">
      <header class="viewer-top glass">
        <button class="nav-orb" id="v-back" aria-label="Fechar"><svg><use href="#i-back"/></svg></button>
        <div class="viewer-title">
          <div class="name-row">
            <b id="v-name"></b>
            <button class="rename-btn" id="v-rename" aria-label="Renomear" title="Renomear"><svg><use href="#i-rename"/></svg></button>
          </div>
          <small id="v-meta"></small>
        </div>
        <button class="v-icon-btn" id="v-full" aria-label="Tela cheia"><svg><use href="#i-fullscreen"/></svg></button>
      </header>
      <div class="viewer-stage" id="v-stage"></div>
      <div class="viewer-bar" id="v-bar"></div>
    </section>

    <!-- Editor de imagem: cortar, mudar proporção, girar e redimensionar -->
    <section class="viewer editor" id="editor" hidden aria-label="Editar imagem">
      <header class="viewer-top glass">
        <button class="nav-orb" id="e-back" aria-label="Cancelar edição"><svg><use href="#i-back"/></svg></button>
        <div class="viewer-title"><b>Editar imagem</b><small id="e-meta"></small></div>
        <button class="btn primary" id="e-save">Salvar cópia</button>
      </header>
      <div class="editor-stage" id="e-stage">
        <canvas id="e-canvas"></canvas>
        <div class="crop-box" id="e-crop">
          <span class="crop-grid"></span>
          <span class="h" data-h="nw"></span><span class="h" data-h="ne"></span>
          <span class="h" data-h="sw"></span><span class="h" data-h="se"></span>
          <span class="h edge" data-h="n"></span><span class="h edge" data-h="s"></span>
          <span class="h edge" data-h="w"></span><span class="h edge" data-h="e"></span>
        </div>
      </div>
      <div class="editor-panel">
        <div class="ratio-row" id="e-ratios"></div>
        <div class="viewer-bar editor-bar">
          <div class="vb-group">
            <button class="vb" id="e-rotate" aria-label="Girar" title="Girar"><svg><use href="#i-rotate"/></svg></button>
            <button class="vb" id="e-resize" aria-label="Redimensionar" title="Redimensionar"><svg><use href="#i-resize"/></svg></button>
          </div>
          <span class="editor-size" id="e-size"></span>
          <div class="vb-group">
            <button class="vb" id="e-reset" aria-label="Desfazer alterações" title="Desfazer alterações"><svg><use href="#i-restore"/></svg></button>
          </div>
        </div>
      </div>
    </section>

    <!-- Caixa de diálogo -->
    <div class="modal-backdrop" id="modal" hidden></div>
    <!-- Balão de notificação -->
    <div class="balloon" id="balloon" hidden></div>

    <input type="file" id="file-input" accept="image/*,video/*,.gif" multiple hidden>
    <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
  </div>

  <script src="js/vendor/capacitor.js"></script>
  <script src="js/native.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
